name: k2pro
description: "Минимальный клиент для кофемашины K2 Pro (BLE)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.35.5
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Управляемое время для таблиц переходов: таймеры цикла проверяются без
  # виджетов, а значит и без tester.pump.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/machine/
    - assets/branding/
